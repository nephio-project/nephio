packages:
  github.com/nephio-project/nephio/controllers/pkg/git:
    interfaces:
      Client:
        config:
          dir: "mocks/external/gitclient"
          filename: "gitclient.go"
  sigs.k8s.io/controller-runtime/pkg/client:
    interfaces:
      Client:
        config:
          dir: "mocks/external/{{ .InterfaceName | lower }}"
          filename: "{{ .InterfaceName | lower }}.go"
      Reader:
        config:
          dir: "mocks/external/{{ .InterfaceName | lower }}"
          filename: "{{ .InterfaceName | lower }}.go"
